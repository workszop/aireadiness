<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ocena gotowości AI</title>
    <meta name="description" content="Bezpłatna samoocena gotowości organizacji do wdrożenia AI: strategia, zasady i zgodność, dane, kompetencje, narzędzia, wdrożenia. 32 pytania, wynik z rekomendacjami.">
    <meta property="og:title" content="Ocena gotowości AI">
    <meta property="og:description" content="32 pytania w 6 obszarach. Sprawdź, na ile Twoja organizacja jest gotowa na AI, i otrzymaj rekomendacje.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://ready.warsztaty-ai.com/">
    <meta name="theme-color" content="#0A1F2C">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23d20757'/%3E%3Cpath d='M9 22l4-12h2l4 12h-2.2l-1-3h-3.6l-1 3H9zm4-5h2.8L14.4 12.6 13 17zm9-7h2v12h-2V10z' fill='%23fff'/%3E%3C/svg%3E">
    <script src="https://cdn.jsdelivr.net/npm/lucide@1.41.0/dist/umd/lucide.min.js"></script>
    <script src="questions.pl.js"></script>
    <script src="questions.en.js"></script>
    <style>
        /* ─── qweb tokens (Quantica Lab website design system) ─── */
        @import url("https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap");
        @import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap");

        :root {
            --quantica-pink:    #d20757;
            --rose-pink:        #d20757;
            --deep-berry:       #8A004C;
            --magenta-tint:     #FFE6F1;
            --violet-primary:   #7030A0;
            --violet-deep:      #4F1F75;
            --ink:              #0A1F2C;
            --mist:             #F4EEFA;
            --near-black:       #111111;
            --white:            #FFFFFF;

            --fg-1:             #111111;
            --fg-2:             #111111;
            --fg-3:             #4B5563;
            --bg-1:             #FFFFFF;
            --bg-2:             #F5F6F8;
            --border-1:         #E6E8EC;
            --border-2:         #D1D5DB;

            --font-display:     "Satoshi", system-ui, -apple-system, sans-serif;
            --font-sans:        "Satoshi", system-ui, -apple-system, sans-serif;
            --font-mono:        "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;

            --radius-sm:        6px;
            --radius-md:        10px;
            --radius-lg:        16px;
            --radius-card:      18px;

            --shadow-pink-soft: 0 6px 18px rgba(210, 7, 87, 0.10);
            --shadow-card:      0 10px 30px -12px rgba(10, 20, 40, 0.12);

            --pink-a03:         rgba(210, 7, 87, 0.03);
            --pink-a07:         rgba(210, 7, 87, 0.07);
            --pink-a45:         rgba(210, 7, 87, 0.45);
            --white-a16:        rgba(255, 255, 255, 0.16);
            --white-a85:        rgba(255, 255, 255, 0.85);
            --white-a92:        rgba(255, 255, 255, 0.92);

            --nav-h: 64px;
            --content-w: 1120px;
            --narrow-w: 860px;
        }

        /* ─── Base ─── */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; scroll-padding-top: calc(var(--nav-h) + 12px); }
        body {
            font-family: var(--font-sans);
            color: var(--fg-2);
            background: var(--bg-1);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
            min-height: 100vh;
        }
        img { max-width: 100%; }
        a { color: var(--quantica-pink); }
        button { font-family: inherit; }
        .wrap { max-width: var(--content-w); margin: 0 auto; padding: 0 28px; }
        .wrap-narrow { max-width: var(--narrow-w); }
        .icon { width: 18px; height: 18px; stroke-width: 2; flex: none; }
        .visually-hidden {
            position: absolute; width: 1px; height: 1px; overflow: hidden;
            clip: rect(0 0 0 0); white-space: nowrap;
        }
        .reveal { opacity: 0; transform: translateY(22px); transition: opacity 600ms ease, transform 600ms ease; }
        .reveal.visible { opacity: 1; transform: none; }
        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            .reveal { opacity: 1; transform: none; transition: none; }
            * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
        }

        /* ─── Nav ─── */
        .nav {
            position: fixed; top: 0; left: 0; right: 0;
            height: var(--nav-h); z-index: 40;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-1);
        }
        .nav-inner {
            max-width: var(--content-w); margin: 0 auto; padding: 0 28px; height: 100%;
            display: flex; align-items: center; justify-content: space-between; gap: 20px;
        }
        .nav-logo img { height: 30px; width: auto; display: block; }
        .nav-links { display: flex; align-items: center; gap: 22px; }
        .nav-link {
            background: none; border: 0; cursor: pointer;
            font-size: 13.5px; font-weight: 500; color: var(--fg-1);
            letter-spacing: 0.01em; display: inline-flex; align-items: center; gap: 7px;
            padding: 6px 0; transition: color 200ms;
        }
        .nav-link:hover, .nav-link[aria-current="page"] { color: var(--quantica-pink); }
        .nav-link:focus-visible { outline: 2px solid var(--quantica-pink); outline-offset: 3px; border-radius: 4px; }
        .nav-link .icon { width: 15px; height: 15px; }
        .lang-toggle {
            display: flex; border: 1px solid var(--border-1); border-radius: 999px; overflow: hidden;
            font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em;
        }
        .lang-btn {
            padding: 6px 12px; border: 0; background: none; cursor: pointer;
            color: var(--fg-3); font-family: inherit; font-weight: 500; transition: background 200ms, color 200ms;
        }
        .lang-btn:hover { color: var(--quantica-pink); }
        .lang-btn[aria-pressed="true"] { background: var(--quantica-pink); color: var(--white); }
        .lang-btn:focus-visible { outline: 2px solid var(--quantica-pink); outline-offset: -2px; }

        /* ─── Hero (welcome) ─── */
        .hero {
            position: relative; display: flex; align-items: center;
            color: var(--white); padding: calc(var(--nav-h) + 72px) 0 84px;
            background: var(--ink); overflow: hidden;
        }
        canvas[data-dots] { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
        .hero-q {
            position: absolute; right: -6%; top: 50%; transform: translateY(-50%);
            width: min(40vw, 520px); opacity: 0.16; pointer-events: none;
        }
        .hero-q img { width: 100%; display: block; }
        .hero-inner { position: relative; z-index: 2; width: 100%; }
        .hero-eyebrow {
            font-family: var(--font-mono); font-weight: 500; font-size: 11px;
            letter-spacing: 0.12em; text-transform: uppercase; color: var(--rose-pink); margin-bottom: 22px;
        }
        .hero-title {
            font-family: var(--font-display); font-weight: 700;
            font-size: clamp(48px, 7.5vw, 104px);
            line-height: 0.98; letter-spacing: -0.03em; color: var(--white);
        }
        .hero-title em { font-style: normal; color: var(--rose-pink); }
        .hero-tagline {
            font-size: clamp(17px, 2vw, 21px); line-height: 1.6;
            color: var(--white-a92); margin-top: 24px;
        }
        .hero-actions { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 36px; }
        .hero-footer {
            position: absolute; bottom: 22px; left: 0; right: 0; z-index: 2;
            display: flex; justify-content: space-between;
            font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.04em;
            color: var(--white-a85);
        }

        /* ─── Pills ─── */
        .pill {
            font-family: var(--font-sans); font-weight: 700; font-size: 14px;
            text-decoration: none; padding: 13px 28px; border-radius: 999px; border: 0;
            display: inline-flex; align-items: center; justify-content: center; gap: 9px; cursor: pointer;
            transition: transform 200ms, background 200ms, color 200ms, border-color 200ms;
        }
        .pill:hover:not(:disabled) { transform: translateY(-1px); }
        .pill:focus-visible { outline: 2px solid var(--quantica-pink); outline-offset: 3px; }
        .pill:disabled { opacity: 0.35; cursor: not-allowed; }
        .pill-solid { background: var(--quantica-pink); color: var(--white); box-shadow: var(--shadow-pink-soft); }
        .pill-solid:hover:not(:disabled) { background: var(--deep-berry); }
        .pill-outline { border: 1.5px solid var(--white); color: var(--white); background: transparent; }
        .pill-outline:hover:not(:disabled) { background: rgba(255, 255, 255, 0.1); }
        .pill-ghost { border: 1.5px solid var(--border-2); color: var(--fg-1); background: var(--bg-1); }
        .pill-ghost:hover:not(:disabled) { border-color: var(--quantica-pink); color: var(--quantica-pink); }
        .pill .icon { width: 17px; height: 17px; }
        .pill-row { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 32px; }
        .pill-row.between { justify-content: space-between; }

        /* ─── Sections ─── */
        .section { padding: 88px 0; }
        .section-page { padding-top: calc(var(--nav-h) + 56px); }
        .section-alt { background: var(--bg-2); }
        .h-section {
            font-family: var(--font-display); font-weight: 700;
            font-size: clamp(28px, 4vw, 42px); line-height: 1.08;
            letter-spacing: -0.025em; color: var(--fg-1); margin-bottom: 14px;
        }
        .h-pink { color: var(--quantica-pink); }
        .lead { font-size: 15.5px; line-height: 1.75; margin-bottom: 14px; max-width: 780px; color: var(--fg-3); }
        .eyebrow {
            font-family: var(--font-mono); font-weight: 500; font-size: 11px;
            letter-spacing: 0.12em; text-transform: uppercase; color: var(--quantica-pink); margin-bottom: 14px;
        }
        .meta {
            font-family: var(--font-mono); font-size: 11.5px; letter-spacing: 0.06em;
            text-transform: uppercase; color: var(--fg-3);
        }
        .progress-row { display: flex; align-items: center; gap: 16px; margin: 26px 0 30px; }
        .progress-row .progress { flex: 1; }
        .progress { height: 6px; background: var(--bg-2); border-radius: 999px; overflow: hidden; }
        .progress-bar { height: 100%; background: var(--quantica-pink); border-radius: 999px; transition: width 400ms ease; }

        /* ─── Bento ─── */
        .bento { display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px; margin-top: 26px; }
        .cell {
            background: var(--bg-1); border: 1px solid var(--border-1); border-radius: var(--radius-card);
            padding: 30px 32px; display: flex; flex-direction: column;
            box-shadow: var(--shadow-card); transition: border-color 250ms, background 250ms;
            text-align: left; color: var(--fg-2);
        }
        .cell:hover { border-color: var(--pink-a45); background: var(--pink-a03); }
        .cell-2 { grid-column: span 2; }
        .cell-3 { grid-column: span 3; }
        .cell-6 { grid-column: span 6; }
        .cell-btn { cursor: pointer; width: 100%; }
        .cell-btn:focus-visible { outline: 2px solid var(--quantica-pink); outline-offset: 3px; }
        .cell-tag {
            font-family: var(--font-mono); font-weight: 500; font-size: 11px;
            letter-spacing: 0.12em; text-transform: uppercase; color: var(--quantica-pink);
            margin-bottom: 18px; display: flex; align-items: center;
            justify-content: space-between; gap: 10px;
        }
        .cell-tag .icon { width: 19px; height: 19px; color: var(--quantica-pink); }
        .cell h3 {
            font-family: var(--font-display); font-weight: 700; font-size: 20px;
            letter-spacing: -0.015em; color: var(--fg-1); margin-bottom: 10px;
        }
        .cell p { font-size: 14.5px; line-height: 1.7; margin: 0; }
        .stat-value {
            font-family: var(--font-display); font-weight: 900; font-size: 44px;
            letter-spacing: -0.03em; line-height: 1; color: var(--fg-1); margin-bottom: 8px;
        }
        .stat-label { color: var(--fg-3); }
        .start-cell {
            border: 1.5px solid var(--quantica-pink); background: rgba(210, 7, 87, 0.04);
            box-shadow: var(--shadow-pink-soft); flex-direction: row; flex-wrap: wrap;
            align-items: center; justify-content: space-between; gap: 26px;
        }
        .start-cell:hover { border-color: var(--quantica-pink); background: var(--pink-a07); }
        .start-text { flex: 1 1 420px; }
        .start-cell h3 { font-size: clamp(22px, 3vw, 28px); margin-bottom: 8px; }
        .start-cell p { font-size: 15px; }

        /* ─── Survey ─── */
        .steps { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 30px; }
        .step {
            font-family: var(--font-mono); font-weight: 500; font-size: 11px; letter-spacing: 0.08em;
            text-transform: uppercase; border: 1px solid var(--border-1); border-radius: 999px;
            padding: 8px 14px; background: var(--bg-1); color: var(--fg-3); cursor: pointer;
            display: inline-flex; align-items: center; gap: 7px;
            transition: background 200ms, color 200ms, border-color 200ms;
        }
        .step:hover { border-color: var(--quantica-pink); color: var(--quantica-pink); }
        .step:focus-visible { outline: 2px solid var(--quantica-pink); outline-offset: 2px; }
        .step .icon { width: 13px; height: 13px; }
        .step.completed { background: var(--magenta-tint); color: var(--quantica-pink); border-color: transparent; }
        .step[aria-current="step"] { background: var(--quantica-pink); color: var(--white); border-color: var(--quantica-pink); }
        .question-cell:hover { border-color: var(--border-1); background: var(--bg-1); }
        .question-text {
            font-family: var(--font-display); font-weight: 700; font-size: clamp(20px, 2.6vw, 26px);
            letter-spacing: -0.02em; line-height: 1.25; color: var(--fg-1); margin: 0 0 22px;
        }
        .answers { display: flex; flex-direction: column; gap: 10px; }
        .answer-btn {
            width: 100%; text-align: left; cursor: pointer;
            border: 1.5px solid var(--border-2); border-radius: var(--radius-md);
            padding: 14px 18px; background: var(--bg-1); color: var(--fg-1);
            font-size: 15px; font-weight: 500; line-height: 1.45;
            display: flex; align-items: center; gap: 14px;
            transition: border-color 200ms, background 200ms, transform 200ms;
        }
        .answer-btn:hover { border-color: var(--pink-a45); background: var(--pink-a03); transform: translateX(3px); }
        .answer-btn:focus-visible { outline: 2px solid var(--quantica-pink); outline-offset: 2px; }
        .answer-btn[aria-pressed="true"] { border-color: var(--quantica-pink); background: var(--magenta-tint); transform: none; }
        .answer-key {
            flex: none; width: 26px; height: 26px; border-radius: 999px;
            border: 1px solid var(--border-2); display: inline-flex; align-items: center; justify-content: center;
            font-family: var(--font-mono); font-size: 11px; color: var(--fg-3);
        }
        .answer-btn[aria-pressed="true"] .answer-key { background: var(--quantica-pink); border-color: var(--quantica-pink); color: var(--white); }
        .answer-text { flex: 1; }
        .answer-btn .icon-check { color: var(--quantica-pink); }
        .kbd-hint { margin-top: 22px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .kbd {
            font-family: var(--font-mono); font-size: 11px; padding: 2px 8px;
            border: 1px solid var(--border-2); border-radius: var(--radius-sm); background: var(--bg-2); color: var(--fg-1);
        }

        /* ─── Dark panels (score, contact) ─── */
        .dark-panel {
            background:
                radial-gradient(ellipse 70% 60% at 80% 50%, rgba(112, 48, 160, 0.28) 0%, transparent 65%),
                radial-gradient(ellipse 50% 70% at 0% 0%, rgba(210, 7, 87, 0.30) 0%, transparent 65%),
                linear-gradient(135deg, var(--ink) 0%, #0d2538 100%);
            color: var(--white); padding: 52px 56px; border-radius: var(--radius-lg);
            position: relative; overflow: hidden;
        }
        .dark-panel > * { position: relative; z-index: 1; }
        .panel-q {
            position: absolute; right: -50px; top: 50%; transform: translateY(-50%);
            width: 280px; opacity: 0.14; pointer-events: none; z-index: 0;
        }
        .panel-label {
            font-family: var(--font-mono); font-weight: 500; font-size: 11px;
            letter-spacing: 0.12em; text-transform: uppercase; color: var(--rose-pink); margin-bottom: 14px;
        }
        .dark-panel h2 {
            color: var(--white); font-family: var(--font-display);
            font-size: clamp(26px, 3.4vw, 36px); font-weight: 700; margin-bottom: 14px;
            letter-spacing: -0.025em; line-height: 1.1;
        }
        .dark-panel p { color: var(--white-a92); font-size: 15px; margin-bottom: 26px; max-width: 560px; }
        .dark-panel .pill-solid { background: var(--white); color: var(--quantica-pink); }
        .dark-panel .pill-solid:hover:not(:disabled) { background: var(--magenta-tint); }
        .dark-panel .pill-row { margin-top: 0; margin-bottom: 30px; }
        .score-big {
            font-family: var(--font-display); font-weight: 900;
            font-size: clamp(72px, 12vw, 132px); line-height: 0.95; letter-spacing: -0.04em; color: var(--white);
        }
        .score-big em { font-style: normal; color: var(--rose-pink); }
        .score-band {
            font-family: var(--font-mono); font-size: 12.5px; letter-spacing: 0.12em; text-transform: uppercase;
            color: var(--white-a85); margin: 14px 0 30px;
        }
        .panel-info {
            display: flex; flex-wrap: wrap; gap: 34px; align-items: flex-start;
            border-top: 1px solid var(--white-a16); padding-top: 22px;
        }
        .panel-meta { font-size: 13px; line-height: 1.7; color: var(--white); max-width: 560px; }
        .panel-meta a { color: var(--white); }
        .panel-logo img { height: 40px; width: auto; display: block; }

        /* ─── Results ─── */
        .result-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
        .result-value { font-family: var(--font-display); font-weight: 900; font-size: 32px; letter-spacing: -0.03em; color: var(--fg-1); line-height: 1; }
        .result-label { margin-top: 12px; display: flex; align-items: center; gap: 6px; }
        .result-label .icon { width: 14px; height: 14px; }
        .share-box { display: flex; gap: 10px; margin-top: 8px; }
        .share-box input {
            flex: 1; min-width: 0; font-family: var(--font-mono); font-size: 12px; padding: 12px 14px;
            border: 1px solid var(--border-2); border-radius: var(--radius-md); background: var(--bg-2); color: var(--fg-1);
        }
        .share-box input:focus-visible { outline: 2px solid var(--quantica-pink); outline-offset: 1px; }
        .note { font-size: 14px; color: var(--fg-3); margin-top: 12px; }
        .banner {
            font-family: var(--font-mono); font-size: 11.5px; letter-spacing: 0.06em; text-transform: uppercase;
            background: var(--mist); border: 1.5px solid var(--violet-primary); border-radius: var(--radius-md);
            padding: 12px 16px; margin-bottom: 26px; color: var(--violet-deep);
        }

        /* ─── Footer ─── */
        .footer {
            padding: 26px 0; border-top: 1px solid var(--border-1);
            font-family: var(--font-mono); font-size: 11.5px;
            letter-spacing: 0.04em; color: var(--fg-3);
        }
        .footer .wrap { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; }

        @media (max-width: 900px) { .cell-2, .cell-3 { grid-column: span 6; } }
        @media (max-width: 768px) {
            .wrap { padding: 0 20px; }
            .nav-inner { padding: 0 20px; gap: 12px; }
            .nav-links { gap: 14px; }
            .nav-link .nav-label { display: none; }
            .nav-link .icon { width: 18px; height: 18px; }
            .hero { padding: calc(var(--nav-h) + 56px) 0 96px; }
            .hero-q { width: 70vw; right: -18%; opacity: 0.12; }
            .section { padding: 60px 0; }
            .section-page { padding-top: calc(var(--nav-h) + 36px); }
            .cell { padding: 24px 22px; }
            .dark-panel { padding: 34px 24px; }
            .pill-row .pill { flex: 1 1 auto; }
            .share-box { flex-direction: column; }
        }
    </style>
</head>
<body>
    <nav class="nav" aria-label="Menu">
        <div class="nav-inner">
            <a class="nav-logo" href="https://quanticalab.ai" target="_blank" rel="noopener"><img src="assets/quantica-logo-color.png" alt="Quantica Lab" width="72" height="30"></a>
            <div class="nav-links">
                <button class="nav-link" id="menu-home" data-action="home">
                    <i data-lucide="home" class="icon" aria-hidden="true"></i>
                    <span class="nav-label" data-key="menuHome">Start</span>
                </button>
                <button class="nav-link" id="menu-status" data-action="status">
                    <i data-lucide="chart-column" class="icon" aria-hidden="true"></i>
                    <span class="nav-label" data-key="menuStatus">Status</span>
                </button>
                <button class="nav-link" id="menu-restart" data-action="restart">
                    <i data-lucide="rotate-ccw" class="icon" aria-hidden="true"></i>
                    <span class="nav-label" data-key="menuRestart">Od nowa</span>
                </button>
                <div class="lang-toggle" role="group" aria-label="Language">
                    <button class="lang-btn" id="lang-pl" data-lang="pl" aria-pressed="true" lang="pl">PL</button>
                    <button class="lang-btn" id="lang-en" data-lang="en" aria-pressed="false" lang="en">EN</button>
                </div>
            </div>
        </div>
    </nav>

    <main id="app"></main>
    <footer class="footer">
        <div class="wrap"><div>quanticalab.ai</div><div data-key="footerTag">AI dla organizacji</div></div>
    </footer>
    <div id="live" class="visually-hidden" aria-live="polite"></div>

    <script>
        // ─── Constants ───
        const STORAGE_KEY = 'aiready_v2';

        // ─── State ───
        const state = {
            lang: 'pl',
            sections: [],        // [{ name, questions: [{ text, options }] }]
            sectionIdx: 0,
            questionIdx: 0,
            answers: {},         // { "sectionIdx-questionIdx": optionIdx }
            view: 'welcome',     // welcome | survey | status | results | confirmRestart | error
            hasSavedData: false,
            shared: false        // viewing a result loaded from a share link
        };

        // ─── DOM refs ───
        const appEl = document.getElementById('app');
        const liveEl = document.getElementById('live');

        // ─── Helpers ───
        const t = key => T[state.lang][key] ?? key;
        const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const qid = (s, q) => `${s}-${q}`;
        const icon = (name, cls = 'icon') => `<i data-lucide="${name}" class="${cls}" aria-hidden="true"></i>`;
        const areaIcon = s => AREA_ICONS[s % AREA_ICONS.length];
        const announce = msg => { liveEl.textContent = ''; setTimeout(() => { liveEl.textContent = msg; }, 50); };

        function storageGet(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
        function storageSet(key, value) { try { localStorage.setItem(key, value); } catch (e) { /* private mode */ } }
        function storageRemove(key) { try { localStorage.removeItem(key); } catch (e) { /* ignore */ } }

        function parseQuestions(text) {
            const sections = [];
            text.split('\n').forEach(line => {
                if (line.startsWith('#')) {
                    sections.push({ name: line.substring(1).trim(), questions: [] });
                } else if (line.trim() && sections.length) {
                    const [question, ...options] = line.split('|').map(s => s.trim());
                    if (question && options.length > 1) {
                        sections[sections.length - 1].questions.push({ text: question, options });
                    }
                }
            });
            return sections;
        }

        function loadQuestions() {
            const text = (window.AIREADY_QUESTIONS || {})[state.lang];
            if (!text) throw new Error(`questions.${state.lang}.js did not load`);
            state.sections = parseQuestions(text);
            if (!state.sections.length) throw new Error('No sections parsed');
            validateState();
        }

        function validateState() {
            const valid = {};
            state.sections.forEach((section, s) => {
                section.questions.forEach((q, i) => {
                    const v = state.answers[qid(s, i)];
                    if (Number.isInteger(v) && v >= 0 && v < q.options.length) valid[qid(s, i)] = v;
                });
            });
            state.answers = valid;
            state.sectionIdx = Math.min(Math.max(0, state.sectionIdx | 0), state.sections.length - 1);
            state.questionIdx = Math.min(Math.max(0, state.questionIdx | 0), state.sections[state.sectionIdx].questions.length - 1);
        }

        function saveState() {
            if (state.shared) return;
            storageSet(STORAGE_KEY, JSON.stringify({
                answers: state.answers,
                sectionIdx: state.sectionIdx,
                questionIdx: state.questionIdx
            }));
        }

        function loadSavedState() {
            try {
                const saved = JSON.parse(storageGet(STORAGE_KEY) || 'null');
                if (saved && saved.answers && typeof saved.answers === 'object') {
                    state.answers = saved.answers;
                    state.sectionIdx = saved.sectionIdx;
                    state.questionIdx = saved.questionIdx;
                }
            } catch (e) {
                storageRemove(STORAGE_KEY);
            }
            state.hasSavedData = Object.keys(state.answers).length > 0;
        }

        function clearSavedState() {
            storageRemove(STORAGE_KEY);
            state.answers = {};
            state.sectionIdx = 0;
            state.questionIdx = 0;
            state.hasSavedData = false;
        }

        // ─── Scoring ───
        function questionScore(s, i) {
            const v = state.answers[qid(s, i)];
            if (v === undefined) return null;
            const n = state.sections[s].questions[i].options.length;
            return (n - 1 - v) / (n - 1);
        }

        function sectionScore(s) {
            const qs = state.sections[s].questions;
            const total = qs.reduce((sum, _, i) => sum + (questionScore(s, i) ?? 0), 0);
            return (total / qs.length) * 100;
        }

        function overallScore() {
            let total = 0, count = 0;
            state.sections.forEach((section, s) => section.questions.forEach((_, i) => {
                total += questionScore(s, i) ?? 0;
                count++;
            }));
            return count ? (total / count) * 100 : 0;
        }

        const bandFor = score => BANDS.find(b => score >= b.min);
        const scoreLabel = score => t(bandFor(score).key);
        const totalQuestions = () => state.sections.reduce((sum, s) => sum + s.questions.length, 0);
        const answeredCount = () => Object.keys(state.answers).length;
        const allAnswered = () => answeredCount() === totalQuestions();
        const maxOptions = () => Math.max(...state.sections.flatMap(s => s.questions.map(q => q.options.length)));

        function sectionProgress(s) {
            const qs = state.sections[s].questions;
            const answered = qs.filter((_, i) => state.answers[qid(s, i)] !== undefined).length;
            return { answered, total: qs.length, percentage: (answered / qs.length) * 100, isCompleted: answered === qs.length };
        }

        function firstUnanswered() {
            for (let s = 0; s < state.sections.length; s++) {
                for (let i = 0; i < state.sections[s].questions.length; i++) {
                    if (state.answers[qid(s, i)] === undefined) return { s, i };
                }
            }
            return null;
        }

        // ─── Share link ───
        function encodeShare() {
            const digits = state.sections.flatMap((section, s) =>
                section.questions.map((_, i) => state.answers[qid(s, i)] ?? '-')).join('');
            return `${location.origin}${location.pathname}#r=${state.lang}.${digits}`;
        }

        function decodeShare() {
            const m = location.hash.match(/^#r=(pl|en)\.([0-9-]+)$/);
            return m ? { lang: m[1], digits: m[2] } : null;
        }

        function applyShare(digits) {
            let k = 0;
            const answers = {};
            state.sections.forEach((section, s) => section.questions.forEach((_, i) => {
                const ch = digits[k++];
                if (ch !== undefined && ch !== '-') answers[qid(s, i)] = parseInt(ch, 10);
            }));
            state.answers = answers;
            validateState();
        }

        // ─── Exports ───
        function download(content, type, ext) {
            const blob = new Blob([content], { type });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `ai-readiness-${new Date().toISOString().split('T')[0]}.${ext}`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function downloadJSON() {
            const data = { timestamp: new Date().toISOString(), language: state.lang, answers: [], scores: {} };
            state.sections.forEach((section, s) => {
                section.questions.forEach((q, i) => {
                    const v = state.answers[qid(s, i)];
                    if (v !== undefined) {
                        data.answers.push({ section: section.name, question: q.text, answer: q.options[v], score: questionScore(s, i) });
                    }
                });
                data.scores[section.name] = Math.round(sectionScore(s));
            });
            data.overallScore = Math.round(overallScore());
            download(JSON.stringify(data, null, 2), 'application/json', 'json');
        }

        function downloadCSV() {
            const cell = v => `"${String(v).replace(/"/g, '""')}"`;
            const rows = [[t('csvSection'), t('csvQuestion'), t('csvAnswer'), t('csvScore')]];
            state.sections.forEach((section, s) => section.questions.forEach((q, i) => {
                const v = state.answers[qid(s, i)];
                if (v !== undefined) rows.push([section.name, q.text, q.options[v], questionScore(s, i).toFixed(2)]);
            }));
            rows.push([], [t('csvSummary')], [t('csvSection'), t('csvSectionScore')]);
            state.sections.forEach((section, s) => rows.push([section.name, Math.round(sectionScore(s))]));
            rows.push([], [t('csvOverall'), Math.round(overallScore())]);
            const csv = '\uFEFF' + rows.map(r => r.map(cell).join(',')).join('\n');
            download(csv, 'text/csv;charset=utf-8;', 'csv');
        }

        async function copyShareLink() {
            const input = document.getElementById('share-link');
            try {
                await navigator.clipboard.writeText(input.value);
                announce(t('copied'));
                document.getElementById('copy-status').textContent = t('copied');
            } catch (e) {
                input.focus();
                input.select();
                document.getElementById('copy-status').textContent = t('copyFailed');
            }
        }

        // ─── Effects (dots, reveal) ───
        function initDots(canvas) {
            const ctx = canvas.getContext('2d');
            const dots = [];
            const resize = () => { canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight; };
            resize();
            window.addEventListener('resize', resize);
            for (let i = 0; i < 70; i++) {
                dots.push({
                    x: Math.random(), y: Math.random(),
                    r: 1 + Math.random() * 2.2,
                    vx: (Math.random() - 0.5) * 0.0004,
                    vy: (Math.random() - 0.5) * 0.0004,
                    o: 0.12 + Math.random() * 0.5
                });
            }
            function frame() {
                if (!canvas.isConnected) { window.removeEventListener('resize', resize); return; }
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                dots.forEach(d => {
                    d.x = (d.x + d.vx + 1) % 1;
                    d.y = (d.y + d.vy + 1) % 1;
                    ctx.beginPath();
                    ctx.arc(d.x * canvas.width, d.y * canvas.height, d.r, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(210, 7, 87, ' + d.o + ')'; // canvas cannot read var(--quantica-pink)
                    ctx.fill();
                });
                if (!REDUCED_MOTION) requestAnimationFrame(frame);
            }
            frame();
        }

        function initReveal(root) {
            const els = root.querySelectorAll('.reveal:not(.visible)');
            if (REDUCED_MOTION || !('IntersectionObserver' in window)) {
                els.forEach(el => el.classList.add('visible'));
                return;
            }
            const observer = new IntersectionObserver(entries => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                        observer.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.12 });
            els.forEach(el => observer.observe(el));
        }

        // ─── Render ───
        const pageHeader = (titleHtml, lead) => `
            <div class="reveal">
                <h1 class="h-section">${titleHtml}</h1>
                ${lead ? `<p class="lead">${escapeHtml(lead)}</p>` : ''}
            </div>`;

        const progressBlock = (answered, total) => {
            const progress = (answered / total) * 100;
            return `
                <div class="progress-row">
                    <div class="progress" role="progressbar" aria-valuenow="${Math.round(progress)}" aria-valuemin="0" aria-valuemax="100">
                        <div class="progress-bar" style="width: ${progress}%"></div>
                    </div>
                    <span class="meta">${answered}/${total} ${escapeHtml(t('questionsAnswered'))} · ${Math.round(progress)}% ${escapeHtml(t('completed'))}</span>
                </div>`;
        };

        function renderSteps() {
            return `
                <nav class="steps" aria-label="${escapeHtml(t('statCategories'))}">
                    ${state.sections.map((section, s) => {
                        const isCurrent = s === state.sectionIdx;
                        const done = !isCurrent && sectionProgress(s).isCompleted;
                        return `
                            <button class="step ${done ? 'completed' : ''}" data-action="goToSection" data-section="${s}" ${isCurrent ? 'aria-current="step"' : ''}>
                                ${done ? icon('check') : `<span>${s + 1}</span>`}
                                ${escapeHtml(section.name)}
                            </button>`;
                    }).join('')}
                </nav>`;
        }

        function renderWelcome() {
            const total = totalQuestions();
            const saved = state.hasSavedData;
            const tagline = saved
                ? `${t('savedSurveyFound')} ${answeredCount()} ${t('answersCount')} ${t('continueOrRestart')}`
                : t('welcomeText');
            const actions = saved
                ? `<button class="pill pill-solid" data-action="continue">${icon('play')} ${escapeHtml(t('continueSurvey'))}</button>
                   <button class="pill pill-outline" data-action="startFresh">${icon('refresh-cw')} ${escapeHtml(t('startFresh'))}</button>`
                : `<button class="pill pill-solid" data-action="start">${icon('arrow-right')} ${escapeHtml(t('startAssessment'))}</button>
                   <button class="pill pill-outline" data-action="status">${icon('chart-column')} ${escapeHtml(t('menuStatus'))}</button>`;
            const stats = [
                ['statQuestions', total, 'statQuestionsText', 'list-checks'],
                ['statCategories', state.sections.length, 'statCategoriesText', 'layout-grid'],
                ['statMinutes', `~${Math.ceil(total * MINUTES_PER_QUESTION)}`, 'statMinutesText', 'timer']
            ];
            return `
                <header class="hero">
                    <canvas data-dots aria-hidden="true"></canvas>
                    <div class="hero-q" aria-hidden="true"><img src="assets/quantica-q-mark-white.png" alt=""></div>
                    <div class="wrap hero-inner">
                        <div class="hero-eyebrow">${escapeHtml(t('heroEyebrow'))}</div>
                        <h1 class="hero-title">${t('titleHtml')}</h1>
                        <p class="hero-tagline">${escapeHtml(tagline)}</p>
                        <div class="hero-actions">${actions}</div>
                    </div>
                    <div class="hero-footer wrap"><div>quanticalab.ai</div><div>${escapeHtml(t('title'))}</div></div>
                </header>
                <section class="section">
                    <div class="wrap">
                        <div class="bento">
                            ${stats.map(([label, value, text, ic]) => `
                                <div class="cell cell-2 reveal">
                                    <div class="cell-tag">${escapeHtml(t(label))}${icon(ic)}</div>
                                    <div class="stat-value">${value}</div>
                                    <p class="stat-label">${escapeHtml(t(text))}</p>
                                </div>`).join('')}
                            <div class="cell cell-6 start-cell reveal">
                                <div class="start-text">
                                    <h3>${escapeHtml(t('helpTitle'))}</h3>
                                    <p>${escapeHtml(t('helpText'))}</p>
                                </div>
                                <button class="pill pill-solid" data-action="${saved ? 'continue' : 'start'}">${escapeHtml(t(saved ? 'continueAssessment' : 'startAssessment'))} ${icon('arrow-right')}</button>
                            </div>
                        </div>
                    </div>
                </section>`;
        }

        function renderConfirmRestart() {
            return `
                <section class="section section-page">
                    <div class="wrap wrap-narrow">
                        ${pageHeader(t('restartTitleHtml'), t('restartText'))}
                        <div class="pill-row">
                            <button class="pill pill-ghost" data-action="cancelRestart">${icon('arrow-left')} ${escapeHtml(t('restartCancel'))}</button>
                            <button class="pill pill-solid" data-action="reset" id="confirm-reset">${icon('rotate-ccw')} ${escapeHtml(t('restartConfirm'))}</button>
                        </div>
                    </div>
                </section>`;
        }

        function renderSurvey() {
            const section = state.sections[state.sectionIdx];
            const question = section.questions[state.questionIdx];
            const id = qid(state.sectionIdx, state.questionIdx);
            const selected = state.answers[id];
            const isFirst = state.sectionIdx === 0 && state.questionIdx === 0;
            const isLast = state.sectionIdx === state.sections.length - 1 && state.questionIdx === section.questions.length - 1;

            return `
                <section class="section section-page">
                    <div class="wrap wrap-narrow">
                        ${renderSteps()}
                        <div class="eyebrow">${escapeHtml(t('part'))} ${state.sectionIdx + 1} · ${escapeHtml(section.name)}</div>
                        ${progressBlock(answeredCount(), totalQuestions())}

                        <div class="cell cell-6 question-cell question" data-question-id="${id}">
                            <div class="cell-tag">
                                <span>${escapeHtml(t('question'))} ${state.questionIdx + 1} ${escapeHtml(t('of'))} ${section.questions.length}</span>
                                ${icon(areaIcon(state.sectionIdx))}
                            </div>
                            <h2 class="question-text" id="question-text">${escapeHtml(question.text)}</h2>
                            <div class="answers" role="group" aria-labelledby="question-text">
                                ${question.options.map((option, idx) => `
                                    <button class="answer-btn" data-action="answer" data-option="${idx}" aria-pressed="${selected === idx}">
                                        <span class="answer-key" aria-hidden="true">${idx + 1}</span>
                                        <span class="answer-text">${escapeHtml(option)}</span>
                                        ${selected === idx ? icon('check', 'icon icon-check') : ''}
                                    </button>`).join('')}
                            </div>
                            <div class="kbd-hint meta">
                                ${icon('keyboard')}
                                <span class="kbd">1</span>-<span class="kbd">${maxOptions()}</span> ${escapeHtml(t('quickSelect'))}
                            </div>
                        </div>

                        <div class="pill-row between">
                            <button class="pill pill-ghost" data-action="prev" ${isFirst ? 'disabled' : ''}>${icon('arrow-left')} ${escapeHtml(t('previous'))}</button>
                            ${isLast && allAnswered()
                                ? `<button class="pill pill-solid" data-action="results">${icon('chart-column')} ${escapeHtml(t('results'))}</button>`
                                : `<button class="pill pill-solid" data-action="next">${escapeHtml(t('next'))} ${icon('arrow-right')}</button>`}
                        </div>
                    </div>
                </section>`;
        }

        function renderStatus() {
            const answered = answeredCount();
            const complete = allAnswered();
            return `
                <section class="section section-page">
                    <div class="wrap">
                        ${pageHeader(t('statusTitleHtml'), t('statusSubtitle'))}
                        ${progressBlock(answered, totalQuestions())}
                        <div class="bento">
                            ${state.sections.map((section, s) => {
                                const p = sectionProgress(s);
                                const status = p.isCompleted
                                    ? `${icon('circle-check')} ${escapeHtml(t('categoryCompleted'))}`
                                    : p.answered > 0
                                        ? `${icon('clock')} ${escapeHtml(t('inProgress'))}`
                                        : `${icon('circle')} ${escapeHtml(t('notStarted'))}`;
                                return `
                                    <button class="cell cell-3 cell-btn reveal" data-action="goToSection" data-section="${s}">
                                        <div class="cell-tag"><span>${escapeHtml(t('part'))} ${s + 1}</span>${icon(areaIcon(s))}</div>
                                        <div class="result-head">
                                            <h3>${escapeHtml(section.name)}</h3>
                                            ${p.isCompleted
                                                ? `<span class="result-value">${Math.round(sectionScore(s))}%</span>`
                                                : `<span class="meta">${p.answered}/${p.total}</span>`}
                                        </div>
                                        <div class="progress"><div class="progress-bar" style="width: ${p.percentage}%"></div></div>
                                        <div class="meta result-label">${status}</div>
                                    </button>`;
                            }).join('')}
                        </div>
                        ${complete ? '' : `<p class="note">${escapeHtml(t('incompleteNote'))}</p>`}
                        <div class="pill-row">
                            ${complete
                                ? `<button class="pill pill-solid" data-action="results">${icon('chart-column')} ${escapeHtml(t('showResults'))}</button>`
                                : `<button class="pill pill-solid" data-action="continue">${icon(answered ? 'play' : 'arrow-right')} ${escapeHtml(t(answered ? 'continueAssessment' : 'startAssessment'))}</button>`}
                        </div>
                    </div>
                </section>`;
        }

        function renderResults() {
            const overall = overallScore();
            const shareUrl = encodeShare();
            const qMark = `<div class="panel-q" aria-hidden="true"><img src="assets/quantica-q-mark-white.png" alt=""></div>`;
            return `
                <section class="section section-page">
                    <div class="wrap">
                        ${state.shared ? `<div class="banner">${escapeHtml(t('sharedBanner'))}</div>` : ''}
                        <div class="dark-panel reveal">
                            ${qMark}
                            <div class="panel-label">${escapeHtml(t('resultsLabel'))}</div>
                            <div class="score-big" data-overall-score="${Math.round(overall)}">${Math.round(overall)}<em>%</em></div>
                            <div class="score-band">${escapeHtml(scoreLabel(overall))}</div>
                            <div class="panel-label">${escapeHtml(t('exportLabel'))}</div>
                            <div class="pill-row">
                                <button class="pill pill-solid" data-action="downloadJSON">${icon('file-json')} JSON</button>
                                <button class="pill pill-outline" data-action="downloadCSV">${icon('file-spreadsheet')} CSV</button>
                            </div>
                            <div class="panel-info">
                                <div class="panel-logo"><img src="assets/quantica-logo-white.png" alt="Quantica Lab"></div>
                                <div class="panel-meta">${escapeHtml(t('overallNote'))}</div>
                            </div>
                        </div>
                    </div>
                </section>

                <section class="section section-alt">
                    <div class="wrap">
                        ${pageHeader(t('detailedResultsHtml'))}
                        <div class="bento">
                            ${state.sections.map((section, s) => {
                                const score = sectionScore(s);
                                return `
                                    <div class="cell cell-2 reveal" data-section-score="${Math.round(score)}">
                                        <div class="cell-tag"><span>${escapeHtml(t('part'))} ${s + 1}</span>${icon(areaIcon(s))}</div>
                                        <div class="result-head">
                                            <h3>${escapeHtml(section.name)}</h3>
                                            <span class="result-value">${Math.round(score)}%</span>
                                        </div>
                                        <div class="progress"><div class="progress-bar" style="width: ${score}%"></div></div>
                                        <div class="meta result-label">${escapeHtml(scoreLabel(score))}</div>
                                    </div>`;
                            }).join('')}
                        </div>
                    </div>
                </section>

                <section class="section">
                    <div class="wrap">
                        ${pageHeader(t('recommendationsHtml'))}
                        <div class="bento">
                            ${state.sections.map((section, s) => {
                                const score = sectionScore(s);
                                const band = bandFor(score);
                                const rec = (T[state.lang].recs[s] || {})[band.rec] || '';
                                return `
                                    <div class="cell cell-3 reveal">
                                        <div class="cell-tag"><span>${Math.round(score)}% · ${escapeHtml(t(band.key))}</span>${icon(areaIcon(s))}</div>
                                        <h3>${escapeHtml(section.name)}</h3>
                                        <p>${escapeHtml(rec)}</p>
                                    </div>`;
                            }).join('')}
                            <div class="cell cell-6 reveal">
                                <div class="cell-tag"><span>${escapeHtml(t('shareTitle'))}</span>${icon('link')}</div>
                                <div class="share-box">
                                    <input id="share-link" type="text" readonly value="${escapeHtml(shareUrl)}" aria-label="${escapeHtml(t('shareTitle'))}">
                                    <button class="pill pill-ghost" data-action="copyLink">${icon('copy')} ${escapeHtml(t('copyLink'))}</button>
                                </div>
                                <p class="note"><span id="copy-status"></span> ${escapeHtml(t('shareNote'))}</p>
                            </div>
                        </div>
                    </div>
                </section>

                <section class="section section-alt">
                    <div class="wrap reveal">
                        <div class="dark-panel">
                            ${qMark}
                            <div class="panel-label">${escapeHtml(t('ctaLabel'))}</div>
                            <h2>${escapeHtml(t('ctaTitle'))}</h2>
                            <p>${escapeHtml(t('ctaText'))}</p>
                            <div class="pill-row">
                                <a class="pill pill-solid" href="mailto:${CONTACT_EMAIL}">${icon('mail')} ${escapeHtml(t('ctaButton'))}</a>
                                ${state.shared
                                    ? `<button class="pill pill-outline" data-action="startOwn">${icon('arrow-right')} ${escapeHtml(t('startOwn'))}</button>`
                                    : `<button class="pill pill-outline" data-action="restart">${icon('rotate-ccw')} ${escapeHtml(t('startAgain'))}</button>`}
                            </div>
                            <div class="panel-info">
                                <div class="panel-logo"><img src="assets/quantica-logo-white.png" alt="Quantica Lab"></div>
                                <div class="panel-meta"><strong>Quantica Lab</strong><br><a href="mailto:${CONTACT_EMAIL}">${CONTACT_EMAIL}</a><br><a href="${BRAND_URL}" target="_blank" rel="noopener">quanticalab.ai</a></div>
                            </div>
                        </div>
                    </div>
                </section>`;
        }

        function render() {
            const views = {
                welcome: renderWelcome,
                confirmRestart: renderConfirmRestart,
                survey: renderSurvey,
                status: renderStatus,
                results: renderResults,
                error: () => `<section class="section section-page"><div class="wrap"><p class="lead">${escapeHtml(t('loadError'))}</p></div></section>`
            };
            appEl.innerHTML = views[state.view]();
            appEl.dataset.view = state.view;
            if (typeof lucide !== 'undefined') lucide.createIcons();
            appEl.querySelectorAll('canvas[data-dots]').forEach(initDots);
            initReveal(appEl);
            document.querySelectorAll('[data-key]').forEach(el => { el.textContent = t(el.dataset.key); });
            document.querySelectorAll('.lang-btn').forEach(el => el.setAttribute('aria-pressed', String(el.dataset.lang === state.lang)));
            document.querySelectorAll('.nav-link').forEach(el => {
                const active = (el.dataset.action === 'home' && state.view === 'welcome') || (el.dataset.action === 'status' && state.view === 'status');
                if (active) el.setAttribute('aria-current', 'page'); else el.removeAttribute('aria-current');
            });
            document.documentElement.lang = state.lang;
            document.title = t('title');
            if (state.view === 'survey') {
                const section = state.sections[state.sectionIdx];
                const q = section.questions[state.questionIdx];
                announce(`${section.name}. ${t('announceQuestion')} ${state.questionIdx + 1} ${t('of')} ${section.questions.length}: ${q.text}`);
            }
        }

        // ─── Actions ───
        function setView(view) { state.view = view; render(); window.scrollTo(0, 0); }

        function goTo(s, i) {
            state.sectionIdx = s;
            state.questionIdx = i;
            saveState();
            setView('survey');
        }

        function nextQuestion() {
            const qs = state.sections[state.sectionIdx].questions;
            if (state.questionIdx < qs.length - 1) return goTo(state.sectionIdx, state.questionIdx + 1);
            if (state.sectionIdx < state.sections.length - 1) return goTo(state.sectionIdx + 1, 0);
            if (allAnswered()) return showResults();
            setView('status');
        }

        function previousQuestion() {
            if (state.questionIdx > 0) return goTo(state.sectionIdx, state.questionIdx - 1);
            if (state.sectionIdx > 0) {
                const prev = state.sectionIdx - 1;
                return goTo(prev, state.sections[prev].questions.length - 1);
            }
        }

        function answer(optionIdx) {
            const q = state.sections[state.sectionIdx].questions[state.questionIdx];
            if (optionIdx < 0 || optionIdx >= q.options.length) return;
            state.answers[qid(state.sectionIdx, state.questionIdx)] = optionIdx;
            state.hasSavedData = true;
            saveState();
            announce(`${t('announceSelected')} ${q.options[optionIdx]}`);
            nextQuestion();
        }

        function showResults() {
            if (!allAnswered()) return setView('status');
            setView('results');
        }

        function continueSurvey() {
            const next = firstUnanswered();
            if (next && state.answers[qid(state.sectionIdx, state.questionIdx)] !== undefined) {
                return goTo(next.s, next.i);
            }
            goTo(state.sectionIdx, state.questionIdx);
        }

        function reset() {
            clearSavedState();
            state.shared = false;
            history.replaceState(null, '', location.pathname);
            setView('welcome');
        }

        function setLanguage(lang) {
            if (!T[lang] || lang === state.lang) return;
            state.lang = lang;
            storageSet(LANG_KEY, lang);
            try {
                loadQuestions();
                render();
            } catch (e) {
                console.error('Error loading questions:', e);
                setView('error');
            }
        }

        const actions = {
            start: () => { state.shared = false; goTo(0, 0); },
            continue: continueSurvey,
            startFresh: () => { clearSavedState(); render(); },
            home: () => { state.hasSavedData = answeredCount() > 0 && !state.shared; setView('welcome'); },
            restart: () => (answeredCount() > 0 ? setView('confirmRestart') : reset()),
            cancelRestart: () => setView(answeredCount() > 0 ? 'survey' : 'welcome'),
            reset,
            status: () => setView('status'),
            results: showResults,
            goToSection: el => goTo(parseInt(el.dataset.section, 10), 0),
            answer: el => answer(parseInt(el.dataset.option, 10)),
            prev: previousQuestion,
            next: nextQuestion,
            downloadJSON,
            downloadCSV,
            copyLink: copyShareLink,
            startOwn: () => {
                state.shared = false;
                history.replaceState(null, '', location.pathname);
                state.answers = {};
                loadSavedState();
                validateState();
                setView('welcome');
            }
        };

        // ─── Listeners ───
        document.addEventListener('click', e => {
            const el = e.target.closest('[data-action]');
            if (!el) return;
            const handler = actions[el.dataset.action];
            if (handler) handler(el);
        });

        document.querySelectorAll('.lang-btn').forEach(btn => btn.addEventListener('click', () => setLanguage(btn.dataset.lang)));

        document.addEventListener('keydown', e => {
            if (state.view !== 'survey') return;
            if (e.altKey || e.ctrlKey || e.metaKey) return;
            const tag = (e.target.tagName || '').toLowerCase();
            if (tag === 'input' || tag === 'textarea') return;

            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                nextQuestion();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                previousQuestion();
            } else if (/^[1-9]$/.test(e.key)) {
                e.preventDefault();
                answer(parseInt(e.key, 10) - 1);
            }
        });

        // ─── Init ───
        (function init() {
            const share = decodeShare();
            const savedLang = storageGet(LANG_KEY);
            state.lang = share ? share.lang : (T[savedLang] ? savedLang : 'pl');
            if (!share) loadSavedState();
            try {
                loadQuestions();
            } catch (e) {
                console.error('Error loading questions:', e);
                return setView('error');
            }
            if (share) {
                state.shared = true;
                applyShare(share.digits);
                state.view = allAnswered() ? 'results' : 'welcome';
                if (!allAnswered()) { state.shared = false; state.answers = {}; loadSavedState(); validateState(); }
            }
            render();
        })();
    </script>
</body>
</html>
