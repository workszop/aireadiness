    <style>
        :root {
            --black: #000000;
            --white: #ffffff;
            --gray-50: #fafafa;
            --gray-100: #f5f5f5;
            --gray-200: #e5e5e5;
            --gray-300: #d4d4d4;
            --gray-600: #525252;
            --gray-800: #262626;
            --gray-900: #171717;
            --text-primary: var(--black);
            --text-secondary: var(--gray-600);
            --text-muted: #6b6b6b;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --font-mono: 'SF Mono', 'Monaco', monospace;
        }
        * { box-sizing: border-box; }
        body {
            font-family: var(--font-sans);
            margin: 0;
            padding: 0;
            background: var(--white);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
            white-space: nowrap;
        }

        /* ─── Scroll progress ─── */
        .scroll-indicator {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: var(--gray-100);
            z-index: 9999;
        }
        .scroll-progress {
            height: 100%;
            background: var(--black);
            width: 0%;
            transition: width 0.1s ease;
        }

        /* ─── Layout ─── */
        .card {
            background: var(--white);
            max-width: 800px;
            margin: 0 auto;
            padding: 80px 40px;
            min-height: 100vh;
            animation: fadeIn 0.4s ease;
        }
        .title {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
            color: var(--black);
            letter-spacing: -0.03em;
            line-height: 1.1;
        }
        .subtitle {
            font-size: 1.125rem;
            color: var(--text-secondary);
            margin: 0 auto 2.5rem;
            line-height: 1.7;
            max-width: 560px;
        }
        h3 {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            margin: 3rem 0 1rem;
        }
        .meta-line {
            text-align: right;
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
        }
        .progress {
            height: 4px;
            background: var(--gray-100);
            border-radius: 2px;
            margin: 1.5rem 0;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background: var(--black);
            border-radius: 2px;
            transition: width 0.4s ease;
        }

        /* ─── Question ─── */
        .question {
            margin: 3rem 0;
            animation: fadeIn 0.3s ease;
        }
        .question-number {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        .question-text {
            font-weight: 500;
            font-size: 1.25rem;
            margin: 1rem 0;
        }
        .answer-btn {
            background: var(--white);
            color: var(--black);
            border: 2px solid var(--gray-300);
            padding: 16px 48px 16px 32px;
            border-radius: 0;
            cursor: pointer;
            width: 100%;
            margin: 8px 0;
            text-align: left;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 500;
            transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
            position: relative;
        }
        .answer-btn:hover { background: var(--gray-100); border-color: var(--gray-600); transform: translateX(4px); }
        .answer-btn:active { background: var(--gray-200); }
        .answer-btn:focus-visible { outline: 2px solid var(--black); outline-offset: 2px; }
        .answer-btn[aria-pressed="true"] { background: var(--black); color: var(--white); border-color: var(--black); }
        .answer-btn[aria-pressed="true"]:hover { background: var(--gray-800); border-color: var(--gray-800); transform: none; }
        .answer-btn[aria-pressed="true"]::after {
            content: '✓';
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-weight: 600;
        }
        .answer-key { opacity: 0.5; margin-right: 8px; }

        /* ─── Buttons ─── */
        .button {
            background: var(--black);
            color: var(--white);
            border: 2px solid var(--black);
            padding: 16px 32px;
            border-radius: 0;
            cursor: pointer;
            width: 100%;
            margin: 8px 0;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 500;
            transition: background 0.2s ease, border-color 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
        }
        .button:hover:not(:disabled) { background: var(--gray-800); border-color: var(--gray-800); }
        .button:active:not(:disabled) { background: var(--gray-900); }
        .button:focus-visible { outline: 2px solid var(--black); outline-offset: 2px; }
        .button:disabled { opacity: 0.3; cursor: not-allowed; }
        .button.secondary { background: var(--white); color: var(--black); }
        .button.secondary:hover:not(:disabled) { background: var(--gray-50); border-color: var(--black); }
        .button-group { display: flex; gap: 16px; margin-top: 3rem; }
        .button-group .button { flex: 1; }
        .button-group.centered { justify-content: center; }
        .button-group.centered .button { max-width: 300px; }
        .icon { width: 18px; height: 18px; flex: none; }
        .icon-sm { width: 12px; height: 12px; vertical-align: middle; margin-right: 4px; }

        /* ─── Section navigator ─── */
        .section-navigator {
            display: flex;
            gap: 2px;
            margin-bottom: 3rem;
            background: var(--gray-200);
        }
        .section-indicator {
            flex: 1;
            min-width: 0;
            padding: 12px 8px;
            text-align: center;
            font-family: inherit;
            font-size: 0.55rem;
            background: var(--white);
            color: var(--text-muted);
            border: none;
            transition: background 0.2s ease, color 0.2s ease;
            cursor: pointer;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            line-height: 1.4;
        }
        .section-indicator small { display: block; font-size: 0.7rem; opacity: 0.8; }
        .section-indicator:hover { background: var(--gray-50); color: var(--text-primary); }
        .section-indicator:focus-visible { outline: 2px solid var(--black); outline-offset: -2px; }
        .section-indicator[aria-current="step"] { background: var(--black); color: var(--white); }
        .section-indicator.completed { background: var(--gray-100); color: var(--text-primary); }

        /* ─── Results and status ─── */
        .results-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1px;
            background: var(--gray-200);
            margin: 2rem 0;
        }
        .result-card { padding: 2rem; background: var(--white); }
        .result-card.clickable { cursor: pointer; border: none; text-align: left; font-family: inherit; width: 100%; }
        .result-card.clickable:hover { background: var(--gray-50); }
        .result-card.clickable:focus-visible { outline: 2px solid var(--black); outline-offset: -2px; }
        .result-head { display: flex; justify-content: space-between; margin-bottom: 0.5rem; gap: 1rem; }
        .result-name { font-weight: 600; font-size: 0.875rem; }
        .result-value { font-weight: 800; font-size: 1.25rem; }
        .result-small { font-size: 0.75rem; color: var(--text-muted); }
        .result-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .score {
            font-size: 4rem;
            font-weight: 800;
            text-align: center;
            letter-spacing: -0.03em;
            color: var(--black);
        }
        .score-label {
            text-align: center;
            margin-bottom: 2rem;
            font-size: 1rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
        }
        .recommendation-card {
            margin: 1rem 0;
            padding: 1.5rem;
            border-left: 4px solid var(--black);
            background: var(--gray-50);
        }
        .recommendation-card.medium { border-left-color: var(--gray-300); }
        .recommendation-card.low { border-left-color: var(--gray-200); }
        .recommendation-title { font-weight: 600; margin-bottom: 0.25rem; }
        .recommendation-title .band { color: var(--text-muted); font-weight: 500; }
        .download-buttons { display: flex; flex-wrap: wrap; gap: 16px; margin: 2rem 0; justify-content: center; }
        .download-buttons .button { width: auto; min-width: 120px; }
        .share-box { display: flex; gap: 8px; margin: 1rem 0; }
        .share-box input {
            flex: 1;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            padding: 12px;
            border: 1px solid var(--gray-300);
            background: var(--gray-50);
            min-width: 0;
        }
        .share-box .button { width: auto; margin: 0; }
        .cta {
            margin: 3rem 0 0;
            padding: 2rem;
            background: var(--black);
            color: var(--white);
        }
        .cta p { margin: 0 0 1rem; }
        .cta .button { background: var(--white); color: var(--black); border-color: var(--white); width: auto; }
        .cta .button:hover { background: var(--gray-100); border-color: var(--gray-100); }
        .note {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-top: 1rem;
            text-align: center;
        }

        /* ─── Welcome ─── */
        .welcome-screen { text-align: center; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1px;
            background: var(--gray-200);
            margin: 4rem 0;
            border: 1px solid var(--gray-200);
        }
        .stat-item { padding: 2rem 1rem; background: var(--gray-50); text-align: center; }
        .stat-value { font-size: 2rem; font-weight: 800; color: var(--black); letter-spacing: -0.02em; margin-bottom: 0.5rem; }
        .stat-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; font-weight: 500; }
        .help-text {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-top: 3rem;
            padding: 1.5rem;
            background: var(--gray-50);
            border: 1px solid var(--gray-200);
            text-align: center;
        }
        .kbd {
            background: var(--gray-100);
            border: 1px solid var(--gray-300);
            border-radius: 4px;
            padding: 2px 8px;
            font-family: var(--font-mono);
            font-size: 0.75rem;
        }

        /* ─── Fixed chrome ─── */
        .top-menu, .language-switcher {
            position: fixed;
            top: 24px;
            z-index: 1000;
            display: flex;
            gap: 0;
            background: var(--white);
            border: 1px solid var(--gray-200);
        }
        .top-menu { left: 24px; }
        .language-switcher { right: 24px; }
        .menu-btn, .lang-btn {
            padding: 8px 16px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            transition: background 0.2s ease, color 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .menu-btn:hover, .lang-btn:hover { background: var(--gray-50); color: var(--text-primary); }
        .menu-btn:focus-visible, .lang-btn:focus-visible { outline: 2px solid var(--black); outline-offset: -2px; }
        .lang-btn[aria-pressed="true"] { background: var(--black); color: var(--white); }
        .menu-btn:not(:last-child) { border-right: 1px solid var(--gray-200); }
        .menu-btn .icon { width: 14px; height: 14px; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        @media (max-width: 768px) {
            .card { padding: 72px 20px 40px; }
            .title { font-size: 2rem; }
            .button-group { flex-direction: column; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .section-navigator { gap: 1px; flex-wrap: wrap; }
            .section-indicator { min-width: 33%; padding: 8px 6px; font-size: 0.45rem; }
            .top-menu { left: 10px; top: 10px; }
            .language-switcher { right: 10px; top: 10px; }
            .menu-btn, .lang-btn { padding: 6px 10px; font-size: 0.65rem; }
            .results-grid { grid-template-columns: 1fr; }
            .share-box { flex-direction: column; }
        }
    </style>
</head>

        // ─── State ───
        const state = {
            lang: 'pl',
            sections: [],        // [{ name, questions: [{ text, options }] }]
            sectionIdx: 0,
            questionIdx: 0,
            answers: {},         // { "sectionIdx-questionIdx": optionIdx }
            view: 'welcome',     // welcome | survey | status | results | confirmRestart | error
            hasSavedData: false,
            shared: false        // viewing a result loaded from a share link
        };

        // ─── DOM refs ───
        const appEl = document.getElementById('app');
        const liveEl = document.getElementById('live');
        const scrollEl = document.getElementById('scrollProgress');

        // ─── Helpers ───
        const t = key => T[state.lang][key] ?? key;
        const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const qid = (s, q) => `${s}-${q}`;
        const icon = (name, cls = 'icon') => `<i data-lucide="${name}" class="${cls}" aria-hidden="true"></i>`;
        const announce = msg => { liveEl.textContent = ''; setTimeout(() => { liveEl.textContent = msg; }, 50); };

        function storageGet(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
        function storageSet(key, value) { try { localStorage.setItem(key, value); } catch (e) { /* private mode */ } }
        function storageRemove(key) { try { localStorage.removeItem(key); } catch (e) { /* ignore */ } }

        function parseQuestions(text) {
            const sections = [];
            text.split('\n').forEach(line => {
                if (line.startsWith('#')) {
                    sections.push({ name: line.substring(1).trim(), questions: [] });
                } else if (line.trim() && sections.length) {
                    const [question, ...options] = line.split('|').map(s => s.trim());
                    if (question && options.length > 1) {
                        sections[sections.length - 1].questions.push({ text: question, options });
                    }
                }
            });
            return sections;
        }

        async function loadQuestions() {
            const response = await fetch(t('questionsFile'));
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            state.sections = parseQuestions(await response.text());
            if (!state.sections.length) throw new Error('No sections parsed');
            validateState();
        }

        function validateState() {
            const valid = {};
            state.sections.forEach((section, s) => {
                section.questions.forEach((q, i) => {
                    const v = state.answers[qid(s, i)];
                    if (Number.isInteger(v) && v >= 0 && v < q.options.length) valid[qid(s, i)] = v;
                });
            });
            state.answers = valid;
            state.sectionIdx = Math.min(Math.max(0, state.sectionIdx | 0), state.sections.length - 1);
            state.questionIdx = Math.min(Math.max(0, state.questionIdx | 0), state.sections[state.sectionIdx].questions.length - 1);
        }

        function saveState() {
            if (state.shared) return;
            storageSet(STORAGE_KEY, JSON.stringify({
                answers: state.answers,
                sectionIdx: state.sectionIdx,
                questionIdx: state.questionIdx
            }));
        }

        function loadSavedState() {
            try {
                const saved = JSON.parse(storageGet(STORAGE_KEY) || 'null');
                if (saved && saved.answers && typeof saved.answers === 'object') {
                    state.answers = saved.answers;
                    state.sectionIdx = saved.sectionIdx;
                    state.questionIdx = saved.questionIdx;
                }
            } catch (e) {
                storageRemove(STORAGE_KEY);
            }
            state.hasSavedData = Object.keys(state.answers).length > 0;
        }

        function clearSavedState() {
            storageRemove(STORAGE_KEY);
            state.answers = {};
            state.sectionIdx = 0;
            state.questionIdx = 0;
            state.hasSavedData = false;
        }

        // ─── Scoring ───
        function questionScore(s, i) {
            const v = state.answers[qid(s, i)];
            if (v === undefined) return null;
            const n = state.sections[s].questions[i].options.length;
            return (n - 1 - v) / (n - 1);
        }

        function sectionScore(s) {
            const qs = state.sections[s].questions;
            const total = qs.reduce((sum, _, i) => sum + (questionScore(s, i) ?? 0), 0);
            return (total / qs.length) * 100;
        }

        function overallScore() {
            let total = 0, count = 0;
            state.sections.forEach((section, s) => section.questions.forEach((_, i) => {
                total += questionScore(s, i) ?? 0;
                count++;
            }));
            return count ? (total / count) * 100 : 0;
        }

        const bandFor = score => BANDS.find(b => score >= b.min);
        const scoreLabel = score => t(bandFor(score).key);
        const totalQuestions = () => state.sections.reduce((sum, s) => sum + s.questions.length, 0);
        const answeredCount = () => Object.keys(state.answers).length;
        const allAnswered = () => answeredCount() === totalQuestions();
        const maxOptions = () => Math.max(...state.sections.flatMap(s => s.questions.map(q => q.options.length)));

        function sectionProgress(s) {
            const qs = state.sections[s].questions;
            const answered = qs.filter((_, i) => state.answers[qid(s, i)] !== undefined).length;
            return { answered, total: qs.length, percentage: (answered / qs.length) * 100, isCompleted: answered === qs.length };
        }

        function firstUnanswered() {
            for (let s = 0; s < state.sections.length; s++) {
                for (let i = 0; i < state.sections[s].questions.length; i++) {
                    if (state.answers[qid(s, i)] === undefined) return { s, i };
                }
            }
            return null;
        }

        // ─── Share link ───
        function encodeShare() {
            const digits = state.sections.flatMap((section, s) =>
                section.questions.map((_, i) => state.answers[qid(s, i)] ?? '-')).join('');
            return `${location.origin}${location.pathname}#r=${state.lang}.${digits}`;
        }

        function decodeShare() {
            const m = location.hash.match(/^#r=(pl|en)\.([0-9-]+)$/);
            return m ? { lang: m[1], digits: m[2] } : null;
        }

        function applyShare(digits) {
            let k = 0;
            const answers = {};
            state.sections.forEach((section, s) => section.questions.forEach((_, i) => {
                const ch = digits[k++];
                if (ch !== undefined && ch !== '-') answers[qid(s, i)] = parseInt(ch, 10);
            }));
            state.answers = answers;
            validateState();
        }

        // ─── Exports ───
        function download(content, type, ext) {
            const blob = new Blob([content], { type });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `ai-readiness-${new Date().toISOString().split('T')[0]}.${ext}`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function downloadJSON() {
            const data = { timestamp: new Date().toISOString(), language: state.lang, answers: [], scores: {} };
            state.sections.forEach((section, s) => {
                section.questions.forEach((q, i) => {
                    const v = state.answers[qid(s, i)];
                    if (v !== undefined) {
                        data.answers.push({ section: section.name, question: q.text, answer: q.options[v], score: questionScore(s, i) });
                    }
                });
                data.scores[section.name] = Math.round(sectionScore(s));
            });
            data.overallScore = Math.round(overallScore());
            download(JSON.stringify(data, null, 2), 'application/json', 'json');
        }

        function downloadCSV() {
            const cell = v => `"${String(v).replace(/"/g, '""')}"`;
            const rows = [[t('csvSection'), t('csvQuestion'), t('csvAnswer'), t('csvScore')]];
            state.sections.forEach((section, s) => section.questions.forEach((q, i) => {
                const v = state.answers[qid(s, i)];
                if (v !== undefined) rows.push([section.name, q.text, q.options[v], questionScore(s, i).toFixed(2)]);
            }));
            rows.push([], [t('csvSummary')], [t('csvSection'), t('csvSectionScore')]);
            state.sections.forEach((section, s) => rows.push([section.name, Math.round(sectionScore(s))]));
            rows.push([], [t('csvOverall'), Math.round(overallScore())]);
            const csv = '\uFEFF' + rows.map(r => r.map(cell).join(',')).join('\n');
            download(csv, 'text/csv;charset=utf-8;', 'csv');
        }

        async function copyShareLink() {
            const input = document.getElementById('share-link');
            try {
                await navigator.clipboard.writeText(input.value);
                announce(t('copied'));
                document.getElementById('copy-status').textContent = t('copied');
            } catch (e) {
                input.focus();
                input.select();
                document.getElementById('copy-status').textContent = t('copyFailed');
            }
        }

        // ─── Render ───
        function renderSectionNavigator() {
            return `
                <nav class="section-navigator" aria-label="${escapeHtml(t('statCategories'))}">
                    ${state.sections.map((section, s) => {
                        const isCurrent = s === state.sectionIdx;
                        const cls = ['section-indicator'];
                        if (!isCurrent && sectionProgress(s).isCompleted) cls.push('completed');
                        return `
                            <button class="${cls.join(' ')}" data-action="goToSection" data-section="${s}" ${isCurrent ? 'aria-current="step"' : ''}>
                                <small>${escapeHtml(t('part'))} ${s + 1}</small>
                                ${escapeHtml(section.name)}
                            </button>`;
                    }).join('')}
                </nav>`;
        }

        function renderWelcome() {
            if (state.hasSavedData) {
                return `
                    <div class="welcome-screen">
                        <h1 class="title">${escapeHtml(t('title'))}</h1>
                        <p class="subtitle">${escapeHtml(t('savedSurveyFound'))} ${answeredCount()} ${escapeHtml(t('answersCount'))} ${escapeHtml(t('continueOrRestart'))}</p>
                        <div class="button-group">
                            <button class="button" data-action="continue">${icon('play')} ${escapeHtml(t('continueSurvey'))}</button>
                            <button class="button secondary" data-action="startFresh">${icon('refresh-cw')} ${escapeHtml(t('startFresh'))}</button>
                        </div>
                    </div>`;
            }
            const total = totalQuestions();
            return `
                <div class="welcome-screen">
                    <h1 class="title">${escapeHtml(t('title'))}</h1>
                    <p class="subtitle">${escapeHtml(t('welcomeText'))}</p>
                    <div class="button-group centered">
                        <button class="button" data-action="start">${icon('arrow-right')} ${escapeHtml(t('startAssessment'))}</button>
                    </div>
                    <div class="stats-grid">
                        <div class="stat-item"><div class="stat-value">${total}</div><div class="stat-label">${escapeHtml(t('statQuestions'))}</div></div>
                        <div class="stat-item"><div class="stat-value">${state.sections.length}</div><div class="stat-label">${escapeHtml(t('statCategories'))}</div></div>
                        <div class="stat-item"><div class="stat-value">~${Math.ceil(total * MINUTES_PER_QUESTION)}</div><div class="stat-label">${escapeHtml(t('statMinutes'))}</div></div>
                        <div class="stat-item"><div class="stat-value">2</div><div class="stat-label">${escapeHtml(t('statFormats'))}</div></div>
                    </div>
                    <div class="help-text">${icon('info', 'icon-sm')} ${escapeHtml(t('helpText'))}</div>
                </div>`;
        }

        function renderConfirmRestart() {
            return `
                <div class="welcome-screen">
                    <h1 class="title">${escapeHtml(t('restartTitle'))}</h1>
                    <p class="subtitle">${escapeHtml(t('restartText'))}</p>
                    <div class="button-group">
                        <button class="button secondary" data-action="cancelRestart">${icon('arrow-left')} ${escapeHtml(t('restartCancel'))}</button>
                        <button class="button" data-action="reset" id="confirm-reset">${icon('rotate-ccw')} ${escapeHtml(t('restartConfirm'))}</button>
                    </div>
                </div>`;
        }

        function renderSurvey() {
            const section = state.sections[state.sectionIdx];
            const question = section.questions[state.questionIdx];
            const id = qid(state.sectionIdx, state.questionIdx);
            const selected = state.answers[id];
            const answered = answeredCount();
            const total = totalQuestions();
            const progress = (answered / total) * 100;
            const isFirst = state.sectionIdx === 0 && state.questionIdx === 0;
            const isLast = state.sectionIdx === state.sections.length - 1 && state.questionIdx === section.questions.length - 1;

            return `
                ${renderSectionNavigator()}
                <h2 class="title">${escapeHtml(section.name)}</h2>
                <div class="progress" role="progressbar" aria-valuenow="${Math.round(progress)}" aria-valuemin="0" aria-valuemax="100">
                    <div class="progress-bar" style="width: ${progress}%"></div>
                </div>
                <div class="meta-line">${answered}/${total} ${escapeHtml(t('questionsAnswered'))} • ${Math.round(progress)}% ${escapeHtml(t('completed'))}</div>

                <div class="question" data-question-id="${id}">
                    <span class="question-number">${escapeHtml(t('question'))} ${state.questionIdx + 1} ${escapeHtml(t('of'))} ${section.questions.length}</span>
                    <p class="question-text" id="question-text">${escapeHtml(question.text)}</p>
                    <div role="group" aria-labelledby="question-text">
                        ${question.options.map((option, idx) => `
                            <button class="answer-btn" data-action="answer" data-option="${idx}" aria-pressed="${selected === idx}">
                                <span class="answer-key" aria-hidden="true">${idx + 1}.</span>${escapeHtml(option)}
                            </button>`).join('')}
                    </div>
                </div>

                <div class="button-group">
                    <button class="button secondary" data-action="prev" ${isFirst ? 'disabled' : ''}>${icon('arrow-left')} ${escapeHtml(t('previous'))}</button>
                    ${isLast && allAnswered()
                        ? `<button class="button" data-action="results">${icon('chart-column')} ${escapeHtml(t('results'))}</button>`
                        : `<button class="button" data-action="next">${escapeHtml(t('next'))} ${icon('arrow-right')}</button>`}
                </div>

                <div class="help-text">
                    ${icon('keyboard', 'icon-sm')}
                    <span class="kbd">1</span>-<span class="kbd">${maxOptions()}</span> ${escapeHtml(t('quickSelect'))}
                </div>`;
        }

        function renderStatus() {
            const answered = answeredCount();
            const total = totalQuestions();
            const progress = (answered / total) * 100;
            const complete = allAnswered();
            return `
                <h1 class="title">${escapeHtml(t('statusTitle'))}</h1>
                <p class="subtitle">${escapeHtml(t('statusSubtitle'))}</p>
                <div class="progress" role="progressbar" aria-valuenow="${Math.round(progress)}" aria-valuemin="0" aria-valuemax="100">
                    <div class="progress-bar" style="width: ${progress}%"></div>
                </div>
                <div class="meta-line">${answered}/${total} ${escapeHtml(t('questionsAnswered'))} • ${Math.round(progress)}% ${escapeHtml(t('completed'))}</div>

                <div class="results-grid">
                    ${state.sections.map((section, s) => {
                        const p = sectionProgress(s);
                        const status = p.isCompleted
                            ? `${icon('circle-check', 'icon-sm')}${escapeHtml(t('categoryCompleted'))}`
                            : p.answered > 0
                                ? `${icon('clock', 'icon-sm')}${escapeHtml(t('inProgress'))}`
                                : `${icon('circle', 'icon-sm')}${escapeHtml(t('notStarted'))}`;
                        return `
                            <button class="result-card clickable" data-action="goToSection" data-section="${s}">
                                <div class="result-head">
                                    <span class="result-name">${escapeHtml(section.name)}</span>
                                    ${p.isCompleted
                                        ? `<span class="result-value">${Math.round(sectionScore(s))}%</span>`
                                        : `<span class="result-small">${p.answered}/${p.total}</span>`}
                                </div>
                                <div class="progress"><div class="progress-bar" style="width: ${p.percentage}%"></div></div>
                                <div class="result-label">${status}</div>
                            </button>`;
                    }).join('')}
                </div>

                ${complete ? '' : `<p class="note">${escapeHtml(t('incompleteNote'))}</p>`}
                <div class="button-group centered">
                    ${complete
                        ? `<button class="button" data-action="results">${icon('chart-column')} ${escapeHtml(t('showResults'))}</button>`
                        : `<button class="button" data-action="continue">${icon(answered ? 'play' : 'arrow-right')} ${escapeHtml(t(answered ? 'continueAssessment' : 'startAssessment'))}</button>`}
                </div>`;
        }

        function renderResults() {
            const overall = overallScore();
            const shareUrl = encodeShare();
            return `
                ${state.shared ? `<p class="note">${escapeHtml(t('sharedBanner'))}</p>` : ''}
                <h1 class="title">${escapeHtml(t('resultsTitle'))}</h1>

                </div>

                <h3>${escapeHtml(t('detailedResults'))}</h3>

                            <div class="result-card" data-section-score="${Math.round(score)}">
                                <div class="result-head">
                                    <span class="result-name">${escapeHtml(section.name)}</span>

                    return `

                            <div class="recommendation-title">${escapeHtml(section.name)} <span class="band">· ${Math.round(score)}%, ${escapeHtml(t(band.key)).toLowerCase()}</span></div>
                            <div>${escapeHtml(rec)}</div>
                        </div>`;
                }).join('')}

                <h3>${escapeHtml(t('shareTitle'))}</h3>

                <div class="button-group centered">
                    ${state.shared
                        ? `<button class="button secondary" data-action="startOwn">${icon('arrow-right')} ${escapeHtml(t('startOwn'))}</button>`
                        : `<button class="button secondary" data-action="restart">${icon('rotate-ccw')} ${escapeHtml(t('startAgain'))}</button>`}
                </div>`;
        }

        function render() {
            const views = {
                welcome: renderWelcome,
                confirmRestart: renderConfirmRestart,
                survey: renderSurvey,
                status: renderStatus,
                results: renderResults,
                error: () => `<p class="subtitle">${escapeHtml(t('loadError'))}</p>`
            };
            appEl.innerHTML = views[state.view]();
            appEl.dataset.view = state.view;
            if (typeof lucide !== 'undefined') lucide.createIcons();
            document.querySelectorAll('.menu-label').forEach(el => { el.textContent = t(el.dataset.key); });
            document.querySelectorAll('.lang-btn').forEach(el => el.setAttribute('aria-pressed', String(el.dataset.lang === state.lang)));
            document.documentElement.lang = state.lang;
            document.title = t('title');
            if (state.view === 'survey') {
                const section = state.sections[state.sectionIdx];
                const q = section.questions[state.questionIdx];
                announce(`${section.name}. ${t('announceQuestion')} ${state.questionIdx + 1} ${t('of')} ${section.questions.length}: ${q.text}`);
            }
        }

        // ─── Actions ───
        function setView(view) { state.view = view; render(); window.scrollTo(0, 0); }

        function goTo(s, i) {
            state.sectionIdx = s;
            state.questionIdx = i;
            saveState();
            setView('survey');
        }

        function nextQuestion() {
            const qs = state.sections[state.sectionIdx].questions;
            if (state.questionIdx < qs.length - 1) return goTo(state.sectionIdx, state.questionIdx + 1);
            if (state.sectionIdx < state.sections.length - 1) return goTo(state.sectionIdx + 1, 0);
            if (allAnswered()) return showResults();
            setView('status');
        }

        function previousQuestion() {
            if (state.questionIdx > 0) return goTo(state.sectionIdx, state.questionIdx - 1);
            if (state.sectionIdx > 0) {
                const prev = state.sectionIdx - 1;
                return goTo(prev, state.sections[prev].questions.length - 1);
            }
        }

        function answer(optionIdx) {
            const q = state.sections[state.sectionIdx].questions[state.questionIdx];
            if (optionIdx < 0 || optionIdx >= q.options.length) return;
            state.answers[qid(state.sectionIdx, state.questionIdx)] = optionIdx;
            state.hasSavedData = true;
            saveState();
            announce(`${t('announceSelected')} ${q.options[optionIdx]}`);
            nextQuestion();
        }

        function showResults() {
            if (!allAnswered()) return setView('status');
            setView('results');
        }

        function continueSurvey() {
            const next = firstUnanswered();
            if (next && state.answers[qid(state.sectionIdx, state.questionIdx)] !== undefined) {
                return goTo(next.s, next.i);
            }
            goTo(state.sectionIdx, state.questionIdx);
        }

        function reset() {
            clearSavedState();
            state.shared = false;
            history.replaceState(null, '', location.pathname);
            setView('welcome');
        }

        async function setLanguage(lang) {
            if (!T[lang] || lang === state.lang) return;
            state.lang = lang;
            storageSet(LANG_KEY, lang);
            try {
                await loadQuestions();
                render();
            } catch (e) {
                console.error('Error loading questions:', e);
                setView('error');
            }
        }

        const actions = {
            start: () => { state.shared = false; goTo(0, 0); },
            continue: continueSurvey,
            startFresh: () => { clearSavedState(); render(); },
            home: () => { state.hasSavedData = answeredCount() > 0 && !state.shared; setView('welcome'); },
            restart: () => (answeredCount() > 0 ? setView('confirmRestart') : reset()),
            cancelRestart: () => setView(answeredCount() > 0 ? 'survey' : 'welcome'),
            reset,
            status: () => setView('status'),
            results: showResults,
            goToSection: el => goTo(parseInt(el.dataset.section, 10), 0),
            answer: el => answer(parseInt(el.dataset.option, 10)),
            prev: previousQuestion,
            next: nextQuestion,
            downloadJSON,
            downloadCSV,
            copyLink: copyShareLink,
            startOwn: () => {
                state.shared = false;
                history.replaceState(null, '', location.pathname);
                state.answers = {};
                loadSavedState();
                validateState();
                setView('welcome');
            }
        };

        // ─── Listeners ───
        document.addEventListener('click', e => {
            const el = e.target.closest('[data-action]');
            if (!el) return;
            const handler = actions[el.dataset.action];
            if (handler) handler(el);
        });

        document.querySelectorAll('.lang-btn').forEach(btn => btn.addEventListener('click', () => setLanguage(btn.dataset.lang)));

        document.addEventListener('keydown', e => {
            if (state.view !== 'survey') return;
            if (e.altKey || e.ctrlKey || e.metaKey) return;
            const tag = (e.target.tagName || '').toLowerCase();
            if (tag === 'input' || tag === 'textarea') return;

            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                nextQuestion();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                previousQuestion();
            } else if (/^[1-9]$/.test(e.key)) {
                e.preventDefault();
                answer(parseInt(e.key, 10) - 1);
            }
        });

        window.addEventListener('scroll', () => {
            const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            const scrolled = height > 0 ? (window.scrollY / height) * 100 : 0;
            scrollEl.style.width = scrolled + '%';
        });

        // ─── Init ───
        (async function init() {
            const share = decodeShare();
            const savedLang = storageGet(LANG_KEY);
            state.lang = share ? share.lang : (T[savedLang] ? savedLang : 'pl');
            if (!share) loadSavedState();
            try {
                await loadQuestions();
            } catch (e) {
                console.error('Error loading questions:', e);
                return setView('error');
            }
            if (share) {
                state.shared = true;
                applyShare(share.digits);
                state.view = allAnswered() ? 'results' : 'welcome';
                if (!allAnswered()) { state.shared = false; state.answers = {}; loadSavedState(); validateState(); }
            }
            render();
        })();
    </script>
</body>
</html>
